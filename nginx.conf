# Serves the built dashboard inside its container (see Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Staff tool: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Built files have content hashes in their names: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Client-side routes (/orders, /messages/12, …) all load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
